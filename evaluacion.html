<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Evaluación Final - Academia Global</title>
    <link rel="stylesheet" href="css/styles.css">
    <style>
        .pregunta { margin-bottom: 1.5rem; background: #f1f5f9; padding: 1rem; border-radius: 6px; }
        .pregunta p { font-weight: 600; margin-bottom: 0.5rem; }
    </style>
</head>
<body>
    <header>
        <h1>Evaluación de Conocimientos</h1>
        <p id="titulo-evaluacion">Evaluación del curso seleccionado</p>
    </header>

    <div class="container">
        <form id="form-evaluacion" onsubmit="calcularEvaluacionDinamica(event)">
            <!-- Las 6 preguntas se cargarán automáticamente aquí según el curso -->
            <div id="preguntas-container"></div>

            <button type="submit" class="btn-success" style="width: 100%; margin-top: 1rem;">Enviar Evaluación y Ver Calificación</button>
        </form>
    </div>

    <script src="app.js"></script>
    <script>
        window.onload = function() {
            cargarPreguntasCurso();
        }
    </script>
</body>
</html>
