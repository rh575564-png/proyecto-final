<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Panel de Administración</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <header>
        <h1>Panel de Administración</h1>
        <p>Control de registros y base de datos simulada</p>
    </header>

    <div class="container">
        <!-- Formulario de Login Admin -->
        <div id="login-admin-box">
            <h2>Acceso Administrador</h2>
            <form onsubmit="verificarAdmin(event)">
                <div class="form-group">
                    <label>Usuario:</label>
                    <input type="text" id="user-admin" required placeholder="admin">
                </div>
                <div class="form-group">
                    <label>Contraseña:</label>
                    <input type="password" id="pass-admin" required placeholder="2026">
                </div>
                <button type="submit">Ingresar</button>
            </form>
            <p style="margin-top: 1rem; font-size: 0.9rem; color: #64748b;">* Credenciales solicitadas por la rúbrica: <strong>admin</strong> / <strong>2026</strong></p>
        </div>

        <!-- Dashboard Admin (Oculto hasta autenticarse) -->
        <div id="dashboard-admin" style="display: none;">
            <h2>Registros de Estudiantes y Evaluaciones</h2>
            <div style="overflow-x: auto;">
                <table style="width: 100%; border-collapse: collapse; margin-top: 1rem;" border="1">
                    <thead>
                        <tr style="background: #f1f5f9; text-align: left;">
                            <th style="padding: 10px;">Nombre</th>
                            <th style="padding: 10px;">Correo</th>
                            <th style="padding: 10px;">Curso</th>
                            <th style="padding: 10px;">Calificación</th>
                            <th style="padding: 10px;">Estado</th>
                        </tr>
                    </thead>
                    <tbody id="tabla-registros">
                        <!-- Se llena con JS -->
                    </tbody>
                </table>
            </div>
            <br>
            <button onclick="cerrarSesionAdmin()" class="btn" style="background-color: #ef4444;">Cerrar Sesión</button>
        </div>

        <div style="margin-top: 2rem;">
            <a href="index.html" style="color: var(--primary);">← Volver a la página principal</a>
        </div>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
